# Nginx Configuration for Tunnel Server (TEMPLATE)
# Usage: DOMAIN=tunnel.example.com envsubst '$DOMAIN' < deploy/nginx.conf > /etc/nginx/sites-enabled/tunnel.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT - wildcard (*.DOMAIN) certificates CANNOT be issued via HTTP-01.
#   Option A (simple): issue 2 certs via HTTP-01 - apex + one level is NOT enough
#              for arbitrary subdomains. Nginx still needs a valid cert; use DNS-01.
#   Option B (correct for tunnels): DNS-01 challenge via your DNS provider:
#              certbot certonly --manual --preferred-challenges dns -d tunnel.example.com -d '*.tunnel.example.com'
#              or with a plugin, e.g. --dns-cloudflare. Then update paths below.
#   DNS records required:
#              A  tunnel.example.com      -> <VPS_IP>
#              A  *.tunnel.example.com    -> <VPS_IP>

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tunnel_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP to HTTPS redirect (also serves HTTP-01 for certbot)
server {
    listen 80;
    server_name ${DOMAIN} *.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name ${DOMAIN} *.${DOMAIN};

    # SSL Certificates (Let's Encrypt, DNS-01 wildcard)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tunnel payloads can be binary - don't block them
    client_max_body_size 50m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket tunnel endpoint (long-lived!)
    location /tunnel {
        proxy_pass http://tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Regular HTTP proxy (tunnel traffic)
    location / {
        proxy_pass http://tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
