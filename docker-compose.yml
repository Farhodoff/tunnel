services:
  tunnel-server:
    build: .
    ports:
      - "8080:8080"
      # Uncomment + open UFW if you use fixed TCP ports:
      # - "19000-19100:19000-19100"
    env_file:
      - path: .env
        required: false
    environment:
      - TUNNEL_DOMAIN=${TUNNEL_DOMAIN:-tunnel.dev}
      - TUNNEL_CUSTOM_DOMAINS=${TUNNEL_CUSTOM_DOMAINS:-}
      - TUNNEL_API_KEYS=${TUNNEL_API_KEYS:-}
      - TUNNEL_API_KEYS_FILE=/app/data/api_keys.json
      - TUNNEL_RATE_LIMIT=${TUNNEL_RATE_LIMIT:-100}
      - TUNNEL_RATE_WINDOW=${TUNNEL_RATE_WINDOW:-60}
      - TUNNEL_REDIS_URL=${TUNNEL_REDIS_URL:-}
      - TUNNEL_LOG_RETENTION=${TUNNEL_LOG_RETENTION:-86400}
      - TUNNEL_WEBHOOK_RETENTION=${TUNNEL_WEBHOOK_RETENTION:-86400}
      - TUNNEL_WEBHOOK_MAX_BODY=${TUNNEL_WEBHOOK_MAX_BODY:-1048576}
      - TUNNEL_WEBHOOK_STORE=${TUNNEL_WEBHOOK_STORE:-/app/data/webhooks.json}
    volumes:
      - ./certs:/app/certs
      - tunnel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for distributed rate limiting
  # Run with: TUNNEL_REDIS_URL=redis://redis:6379/0 docker compose --profile with-redis up
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  redis-data:
  tunnel-data:
