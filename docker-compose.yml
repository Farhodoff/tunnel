services:
  tunnel-server:
    build: .
    ports:
      - "8080:8080"
      # Uncomment + open UFW if you use fixed TCP ports:
      # - "19000-19100:19000-19100"
    env_file:
      - path: .env
        required: false
    environment:
      - TUNNEL_DOMAIN=${TUNNEL_DOMAIN:-tunnel.dev}
      - TUNNEL_API_KEYS=${TUNNEL_API_KEYS:-}
      - TUNNEL_RATE_LIMIT=${TUNNEL_RATE_LIMIT:-100}
      - TUNNEL_RATE_WINDOW=${TUNNEL_RATE_WINDOW:-60}
      - TUNNEL_REDIS_URL=${TUNNEL_REDIS_URL:-}
    volumes:
      - ./certs:/app/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for distributed rate limiting
  # Run with: TUNNEL_REDIS_URL=redis://redis:6379/0 docker compose --profile with-redis up
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  redis-data:
